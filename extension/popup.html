<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tollkit Wallet</title>
<style>
:root{--bg:#0e1015;--card:#171a21;--surf:#1f232c;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa1b2;--acc:#4a8eff;--acc2:#2f6bff;--ok:#2fd27a;--bad:#ff6b6b}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f8;--card:#fff;--surf:#f1f2f6;--line:#e2e5ec;--tx:#141821;--mut:#5d6474;--ok:#14a05a;--bad:#d93c3c}}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header img{width:28px;height:28px}
header b{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace}header b span{color:var(--acc)}
main{padding:14px 16px 16px}
p{margin:0 0 10px;color:var(--mut)}
ol{margin:0 0 12px;padding-left:18px;color:var(--mut)}ol li{margin:3px 0}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--tx);font:15px ui-monospace,Menlo,monospace;letter-spacing:.04em}
input:focus{outline:2px solid var(--acc);border-color:transparent}
button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:var(--acc2);color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer}
button.g{background:var(--surf);color:var(--tx)}
.row{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surf);border-radius:10px;margin-top:8px}
.row small{display:block;color:var(--mut);font-size:11.5px}
.addr{font:12px ui-monospace,Menlo,monospace;word-break:break-all}
.msg{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--surf);font-size:13px}.err{color:var(--bad)}.okc{color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--bad)}
h4{margin:14px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>Toll<span>kit</span></b></header>
<main id="main"><p>Loading…</p></main>
<script src="popup.js"></script>
</body>
</html>
